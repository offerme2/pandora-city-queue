<!DOCTYPE html>
<html lang="zh-Hant" data-layout="wide">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANDORA CITY｜線上叫號看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PANDORA CITY — 線上叫號看板
   - 同一個網址、兩套固定版型（非 RWD）
   - 裝置判定：螢幕最短邊 <= 500px -> 手機版，其餘（平板 / 電腦）-> 寬版
   - 測試用網址參數：?layout=phone / ?layout=wide 可強制切換
   ============================================================ */

:root{
  --bg:#02040e;
  --ink:#f6fbff;
  --ink-dim:#91a8b7;
  --panel:rgba(5,18,34,.77);
  --panel-line:rgba(112,173,201,.4);
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"Rajdhani","Noto Sans TC",sans-serif;

  /* 四區主色（同 frontend-v2-tv/styles.css） */
  --a-a:#19e7ee;   /* A 報到區   cyan   */
  --a-b:#418bf1;   /* B 商售區   blue   */
  --a-c:#7563e8;   /* C 預約取貨 violet */
  --a-d:#d34fc8;   /* D 尊榮酒吧 pink   */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-zh);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
[data-layout="phone"] body{overflow-x:hidden;overflow-y:auto}

/* ---------- 背景層（同 frontend-v2-tv 擺法：sky 直接 cover、city 用 112vw 的 <img> 貼上緣） ---------- */
.backdrop{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:var(--bg) url("image/pandora-sky.jpg") center / cover no-repeat;
}
.backdrop .city{
  position:absolute;top:-120px;left:50%;transform:translateX(-50%);
  width:max(1900px, 112vw);max-width:none;
  opacity:.64;filter:saturate(1.18) contrast(1.08);
}
.backdrop .veil{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg, #02040e 0%, rgba(2,4,14,.18) 4%, transparent 12%, transparent 88%, rgba(2,4,14,.18) 96%, #02040e 100%),
    linear-gradient(180deg, rgba(2,4,14,.52) 0%, transparent 11%, rgba(3,7,25,.12) 28%, rgba(3,6,22,.48) 58%, rgba(3,6,20,.9) 84%, #02040e 100%);
}
[data-layout="phone"] .backdrop .city{top:-40px;width:max(760px, 165vw)}
[data-layout="phone"] .backdrop .veil{
  background:linear-gradient(180deg,
    rgba(2,4,14,.5) 0%, rgba(2,4,14,.55) 26%, rgba(2,4,14,.7) 55%, rgba(2,4,14,.9) 85%, #02040e 100%);
}

/* ---------- 舞台（固定版型，JS 以 scale 適配） ---------- */
.stage{position:fixed;z-index:1;color:var(--ink)}
[data-layout="wide"] .stage--phone{display:none}
[data-layout="phone"] .stage--wide{display:none}

[data-layout="wide"] .stage{
  left:50%;top:50%;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--scale,1));
}
[data-layout="phone"] .stage{
  left:50%;top:0;
  width:390px;
  transform:translateX(-50%) scale(var(--scale,1));
  transform-origin:top center;
}

/* ================= 共用元件 ================= */

/* 標頭 */
.brand{display:flex;align-items:center;gap:22px}
.brand .bd2{height:52px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.brand .sep{width:1px;height:40px;background:linear-gradient(transparent,rgba(150,180,255,.6),transparent)}
.brand .pandora{height:44px;filter:drop-shadow(0 0 14px rgba(80,150,255,.55))}

.infobar{display:flex;align-items:stretch;border:1px solid var(--panel-line);
  background:var(--panel);overflow:hidden}
.infobar .seg{display:flex;align-items:center;gap:10px;padding:0 26px;
  font-weight:700;letter-spacing:.04em;white-space:nowrap}
.infobar .seg + .seg{border-left:1px solid var(--panel-line)}
.infobar .seg .lbl{color:var(--ink-dim);font-weight:500;font-size:.82em}
.infobar .seg .val{font-family:var(--font-num);font-weight:600}

/* 叫號卡（光效 + 顏色同 frontend-v2-tv/styles.css 的 .queue-card：
   邊框 + 角落聚光 ::before 光環 + ::after 內部光暈，靜態、無動畫） */
.grid{display:grid;gap:22px}
.card{
  --accent:var(--a-a);
  --spot-x:16%;
  --spot-y:0%;
  --cut:24px;       /* 左上 / 左下 大切角 */
  --cut-sm:14px;    /* 右上 小切角 */
  --clip:polygon(
    var(--cut) 0,
    calc(100% - var(--cut-sm)) 0,
    100% var(--cut-sm),
    100% 100%,
    var(--cut) 100%,
    0 calc(100% - var(--cut)),
    0 var(--cut));
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:30px;
  padding:30px 40px;
  clip-path:var(--clip);
  border:1px solid color-mix(in srgb, var(--accent) 58%, transparent);
  background:linear-gradient(112deg,
    color-mix(in srgb, var(--accent) 13%, rgba(4,21,31,.95)),
    rgba(5,9,25,.96) 68%);
  box-shadow:inset 0 0 50px color-mix(in srgb, var(--accent) 9%, transparent);
}
/* 角落聚光光環（貼邊 3px） */
.card::before{
  content:"";position:absolute;inset:-1px;z-index:2;padding:3px;pointer-events:none;
  background:radial-gradient(240px circle at var(--spot-x) var(--spot-y),
    color-mix(in srgb, var(--accent) 100%, #fff 15%) 0,
    color-mix(in srgb, var(--accent) 72%, transparent) 36%,
    transparent 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.72;
}
/* 內部聚光光暈 */
.card::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(300px circle at var(--spot-x) var(--spot-y),
    color-mix(in srgb, var(--accent) 28%, transparent), transparent 72%);
  opacity:.3;
}
.card > *{position:relative;z-index:1}

.badge{
  flex:none;display:grid;place-items:center;
  width:104px;height:120px;
  border:2px solid var(--accent);
  border-radius:10px 24px 10px 24px;
  font-family:var(--font-num);font-weight:900;font-size:76px;line-height:1;
  color:#fff;
  background:color-mix(in srgb, var(--accent) 60%, #08142a);
  box-shadow:0 0 28px color-mix(in srgb, var(--accent) 22%, transparent);
}

.card .info{flex:1 1 auto;min-width:0}
.card .name{font-weight:900;font-size:44px;letter-spacing:.03em;white-space:nowrap}
.card .label{margin-top:8px;color:var(--ink-dim);font-weight:500;font-size:22px;letter-spacing:.04em}

.card .value{flex:none;margin-left:20px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.card .num{
  font-family:var(--font-num);font-weight:700;font-size:92px;line-height:1;letter-spacing:.012em;white-space:nowrap;
  color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);
}
.card .num.num--text{font-family:var(--font-zh);font-weight:900;font-size:60px}
.card .sub{font-family:var(--font-num);font-weight:600;font-size:28px;color:#c1d0d8;letter-spacing:.04em}

.card.zone--b{--accent:var(--a-b)}
.card.zone--c{--accent:var(--a-c)}
.card.zone--d{--accent:var(--a-d)}

/* 頁尾 */
.foot{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  border:1px solid rgba(211,79,200,.35);background:linear-gradient(100deg, rgba(4,30,41,.94), rgba(5,12,29,.91));
  clip-path:polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  text-align:center}
.foot .main{font-weight:700;letter-spacing:.06em}
.foot .note{color:var(--ink-dim);font-weight:500}

/* ================= 寬版（平板 / 電腦） ================= */
.stage--wide{padding:56px 64px 48px;display:flex;flex-direction:column}
.stage--wide .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.stage--wide .infobar{height:64px;font-size:24px}
.stage--wide .grid{grid-template-columns:1fr 1fr;grid-auto-rows:266px;flex:0 0 auto;margin-block:auto}
.stage--wide .foot{height:70px;font-size:22px}
.stage--wide .foot .note{font-size:19px}

/* ================= 手機版 ================= */
.stage--phone{padding:34px 20px 26px;display:flex;flex-direction:column;min-height:844px}
.stage--phone .brand{justify-content:center;gap:14px;margin-bottom:20px}
.stage--phone .brand .bd2{height:30px}
.stage--phone .brand .sep{height:24px}
.stage--phone .brand .pandora{height:26px}
.stage--phone .infobar{height:52px;font-size:15px;margin-bottom:18px}
.stage--phone .infobar .seg{flex:1;justify-content:center;padding:0 10px}
.stage--phone .grid{grid-template-columns:1fr;gap:14px;flex:0 0 auto;margin-block:auto}
.stage--phone .card{--cut:16px;--cut-sm:10px;padding:16px 20px;gap:16px}
.stage--phone .badge{width:60px;height:72px;font-size:40px;border-radius:7px 16px 7px 16px}
.stage--phone .card .name{font-size:26px}
.stage--phone .card .label{font-size:14px;margin-top:4px}
.stage--phone .card .num{font-size:46px}
.stage--phone .card .num.num--text{font-size:30px}
.stage--phone .card .sub{font-size:16px}
.stage--phone .foot{margin-top:18px;padding:12px 14px;flex-direction:column;gap:4px}
.stage--phone .foot .main{font-size:14px}
.stage--phone .foot .note{font-size:11px}
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <img class="city" src="image/pandora-buildings.png" alt="">
  <div class="veil"></div>
</div>

<!-- ===================== 寬版 ===================== -->
<main class="stage stage--wide">
  <div class="top">
    <div class="brand">
      <img class="bd2" src="image/browndust2-white-tc.png" alt="BROWN DUST II">
      <span class="sep"></span>
      <img class="pandora" src="image/pandora-city.webp" alt="PANDORA CITY">
    </div>
    <div class="infobar">
      <div class="seg"><span class="val" data-bind="event"></span></div>
      <div class="seg"><span class="lbl">最後更新時間</span><span class="val" data-bind="updated"></span></div>
    </div>
  </div>

  <div class="grid" data-bind="grid"></div>

  <div class="foot">
    <span class="main">請於叫號前返回指定區域等候</span>
    <span class="note">目前號碼以前皆可入場,實際叫號狀況以現場工作人員公告為準</span>
  </div>
</main>

<!-- ===================== 手機版 ===================== -->
<main class="stage stage--phone">
  <div class="brand">
    <img class="bd2" src="image/browndust2-white-tc.png" alt="BROWN DUST II">
    <span class="sep"></span>
    <img class="pandora" src="image/pandora-city.webp" alt="PANDORA CITY">
  </div>
  <div class="infobar">
    <div class="seg"><span class="val" data-bind="event"></span></div>
    <div class="seg"><span class="lbl">更新</span><span class="val" data-bind="updated"></span></div>
  </div>

  <div class="grid" data-bind="grid"></div>

  <div class="foot">
    <span class="main">請於叫號前返回指定區域等候</span>
    <span class="note">實際叫號狀況以現場工作人員公告為準</span>
  </div>
</main>

<script>
/* ============================================================
   資料來源 —— 之後接後端只要改 fetchState()
   ============================================================ */
const STATE = {
  event: '2027 台北電玩展',
  zones: [
    { id:'A', cls:'zone--a', name:'報到區',   label:'目前叫號', value:'A-001' },
    { id:'B', cls:'zone--b', name:'商售區',   label:'目前叫號', value:'B-002' },
    { id:'C', cls:'zone--c', name:'預約取貨', label:'目前叫號', value:'C-012' },
    { id:'D', cls:'zone--d', name:'尊榮酒吧', label:'目前梯次', value:'第1梯次', sub:'10:00–10:25' },
  ]
};

// TODO: 接真實叫號來源（輪詢或 WebSocket）
// async function fetchState(){ const r = await fetch('/api/queue'); return r.json(); }

/* ---------- 版型判定（非 RWD，載入時決定一次） ---------- */
function pickLayout(){
  const forced = new URLSearchParams(location.search).get('layout');
  if (forced === 'phone' || forced === 'wide') return forced;
  const shortest = Math.min(screen.width, screen.height);
  return shortest <= 500 ? 'phone' : 'wide';
}
document.documentElement.dataset.layout = pickLayout();

/* ---------- 舞台 + 背景縮放適配 ---------- */
function fit(){
  const layout = document.documentElement.dataset.layout;
  const stage = document.querySelector('.stage--' + layout);
  if (!stage) return;

  if (layout === 'wide'){
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.setProperty('--scale', s);
  } else {
    const s = innerWidth / 390;
    stage.style.setProperty('--scale', s);
    document.body.style.height = (stage.offsetHeight * s) + 'px';
  }
}

/* ---------- 渲染 ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function nowHM(){ const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function cardHTML(z){
  const isText = /[^\x00-\x7F]/.test(z.value);   // 含中文等非 ASCII -> 用文字級距
  return `<article class="card ${z.cls}">
    <div class="badge">${z.id}</div>
    <div class="info">
      <div class="name">${z.name}</div>
      <div class="label">${z.label}</div>
    </div>
    <div class="value">
      <div class="num${isText ? ' num--text' : ''}">${z.value}</div>
      ${z.sub ? `<div class="sub">${z.sub}</div>` : ``}
    </div>
  </article>`;
}

function render(state){
  document.querySelectorAll('[data-bind="event"]').forEach(el => el.textContent = state.event);
  document.querySelectorAll('[data-bind="updated"]').forEach(el => el.textContent = nowHM());
  document.querySelectorAll('[data-bind="grid"]').forEach(el => {
    el.innerHTML = state.zones.map(cardHTML).join('');
  });
  fit();
}

render(STATE);

// 只有「寬度」變才重排。iOS Safari 捲動收合網址列會狂發 resize（只改高度），
// 若每次都重排 + 改 body 高度會形成迴圈，Safari 就會「重複發生問題」而重載。
let lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  fit();
});
addEventListener('orientationchange', () => setTimeout(() => { lastW = innerWidth; fit(); }, 250));

// 更新時間戳（暫以本機時間；接後端後改為資料回傳值）
setInterval(() => {
  document.querySelectorAll('[data-bind="updated"]').forEach(el => el.textContent = nowHM());
}, 15000);
</script>
</body>
</html>
