<!DOCTYPE html>
<html lang="zh-Hant" data-layout="wide">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANDORA CITY｜線上叫號看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PANDORA CITY — 線上叫號看板
   - 同一個網址、兩套固定版型（非 RWD）
   - 裝置判定：螢幕最短邊 <= 500px -> 手機版，其餘（平板 / 電腦）-> 寬版
   - 測試用網址參數：?layout=phone / ?layout=wide 可強制切換
   ============================================================ */

:root{
  --bg:#04060f;
  --ink:#eaf2ff;
  --ink-dim:#8fa4c9;
  --panel:rgba(8,13,30,.58);
  --panel-line:rgba(120,160,255,.22);
  --font-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"Rajdhani","Noto Sans TC",sans-serif;

  /* 四區主色 */
  --a-a:#22e3c9;   /* A 報到區   青 */
  --a-b:#3b7bff;   /* B 商售區   藍 */
  --a-c:#9b6cff;   /* C 預約取貨 紫 */
  --a-d:#f0429e;   /* D 尊榮酒吧 洋紅 */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-zh);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
[data-layout="phone"] body{overflow-x:hidden;overflow-y:auto}

/* ---------- 背景層（直接沿用 BD2 官網擺法） ----------
   sky / buildings 都用「原生尺寸 ÷ --effect-ratio」、水平置中、以固定 top 偏移擺放，
   底部與兩側直接溢出、靠 .backdrop 的 overflow:hidden 裁掉。ratio 由 JS 依版型給值。 */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.backdrop .sky{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:calc(2560px / var(--effect-ratio,1));
  height:calc(1312px / var(--effect-ratio,1));
  background:url("image/pandora-sky.jpg") center top/100% 100% no-repeat;
  filter:brightness(.6) saturate(1.12) hue-rotate(-4deg);
}
.backdrop .city{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(132px / var(--effect-ratio,1));
  width:calc(2560px / var(--effect-ratio,1));
  height:calc(1336px / var(--effect-ratio,1));
  background:url("image/pandora-buildings.png") center top/100% 100% no-repeat;
}
.backdrop .veil{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(4,6,15,.5) 0, rgba(4,6,15,.12) 15%, transparent 42%, transparent 74%, rgba(4,6,15,.4) 100%),
    radial-gradient(150% 80% at 50% 26%, transparent 36%, rgba(4,6,15,.28) 84%, rgba(4,6,15,.55) 100%);
}

/* ---------- 舞台（固定版型，JS 以 scale 適配） ---------- */
.stage{position:fixed;z-index:1;color:var(--ink)}
[data-layout="wide"] .stage--phone{display:none}
[data-layout="phone"] .stage--wide{display:none}

[data-layout="wide"] .stage{
  left:50%;top:50%;
  width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--scale,1));
}
[data-layout="phone"] .stage{
  left:0;right:0;top:0;width:390px;margin-inline:auto;
  transform:scale(var(--scale,1));
  transform-origin:top center;
}

/* ================= 共用元件 ================= */

/* 標頭 */
.brand{display:flex;align-items:center;gap:22px}
.brand .bd2{height:52px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
.brand .sep{width:1px;height:40px;background:linear-gradient(transparent,rgba(150,180,255,.6),transparent)}
.brand .pandora{height:44px;filter:drop-shadow(0 0 14px rgba(80,150,255,.55))}

.infobar{display:flex;align-items:stretch;border:1px solid var(--panel-line);
  border-radius:6px;background:var(--panel);backdrop-filter:blur(8px);overflow:hidden}
.infobar .seg{display:flex;align-items:center;gap:10px;padding:0 26px;
  font-weight:700;letter-spacing:.04em;white-space:nowrap}
.infobar .seg + .seg{border-left:1px solid var(--panel-line)}
.infobar .seg .lbl{color:var(--ink-dim);font-weight:500;font-size:.82em}
.infobar .seg .val{font-family:var(--font-num);font-weight:600}

/* 叫號卡 */
.grid{display:grid;gap:26px}
.card{
  --accent:#5cf;
  --cut:26px;       /* 左上 / 左下 大切角 */
  --cut-sm:14px;    /* 右上 小切角 */
  --frame:1.3px;    /* 霓虹外框線寬 */
  --clip:polygon(
    var(--cut) 0,
    calc(100% - var(--cut-sm)) 0,
    100% var(--cut-sm),
    100% 100%,
    var(--cut) 100%,
    0 calc(100% - var(--cut)),
    0 var(--cut));
  position:relative;
  padding:var(--frame);
  clip-path:var(--clip);
  overflow:hidden;
  /* 這一層 = 發光外框（亮色） */
  background:linear-gradient(150deg,
    color-mix(in srgb, var(--accent) 88%, #fff 12%),
    var(--accent) 45%,
    color-mix(in srgb, var(--accent) 84%, #000 16%));
  /* 霓虹外暈（靜態 drop-shadow） */
  filter:
    drop-shadow(0 0 3px var(--accent))
    drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 40%, transparent))
    drop-shadow(0 14px 34px rgba(0,0,0,.42));
}
/* 旋轉掃光：靜態環形遮罩窗，內層 ::before 用 transform 旋轉（走合成層，PC/手機都不卡） */
.card__sweep{
  position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;
  clip-path:var(--clip);padding:8px;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  mix-blend-mode:screen;opacity:.7;
}
.card__sweep::before{
  content:"";position:absolute;top:50%;left:50%;width:230%;aspect-ratio:1;translate:-50% -50%;
  background:conic-gradient(from 0deg,
    transparent 0turn,
    color-mix(in srgb, var(--accent) 95%, #fff) .07turn,
    color-mix(in srgb, var(--accent) 55%, transparent) .14turn,
    transparent .26turn, transparent 1turn);
  animation:spin 4.6s linear infinite;
}
/* 內層：同切角形狀、深色玻璃，蓋掉中間留下外框 */
.card__in{
  position:relative;z-index:2;
  clip-path:var(--clip);
  display:flex;align-items:center;gap:26px;
  padding:28px 38px;
  min-height:100%;
  background:linear-gradient(150deg, rgba(10,15,32,.94), rgba(8,12,26,.82));
  backdrop-filter:blur(10px);
  box-shadow:
    inset 0 0 22px color-mix(in srgb, var(--accent) 20%, transparent),
    inset 0 1px 0 rgba(255,255,255,.06);
}
/* 內側掃描光暈：opacity 呼吸（合成層安全） */
.card__in::after{
  content:"";position:absolute;inset:0;z-index:-1;clip-path:var(--clip);pointer-events:none;
  background:radial-gradient(65% 125% at 20% 50%,
    color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%);
  mix-blend-mode:screen;opacity:.5;
  animation:glowPulse 3.6s ease-in-out infinite;
}

.badge{
  flex:none;display:grid;place-items:center;
  width:104px;height:104px;
  clip-path:polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  font-family:var(--font-num);font-weight:700;font-size:64px;line-height:1;
  color:#fff;
  background:linear-gradient(160deg,
    color-mix(in srgb, var(--accent) 78%, #fff 22%),
    color-mix(in srgb, var(--accent) 82%, #000 18%));
  box-shadow:
    inset 0 2px 8px rgba(255,255,255,.45),
    inset 0 -6px 14px rgba(0,0,0,.28);
  filter:drop-shadow(0 0 16px var(--accent)) drop-shadow(0 0 30px color-mix(in srgb, var(--accent) 45%, transparent));
  text-shadow:0 0 14px rgba(255,255,255,.65);
}

.card .info{flex:1 1 auto;min-width:0}
.card .name{font-weight:900;font-size:44px;letter-spacing:.02em;white-space:nowrap;
  text-shadow:0 0 18px color-mix(in srgb, var(--accent) 50%, transparent)}
.card .label{margin-top:6px;color:var(--ink-dim);font-weight:500;font-size:20px;letter-spacing:.06em}

.card .value{flex:none;margin-left:20px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.card .num{
  font-family:var(--font-num);font-weight:700;font-size:96px;line-height:.95;letter-spacing:.02em;white-space:nowrap;
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 26px var(--accent),
    0 0 54px color-mix(in srgb, var(--accent) 60%, transparent);
}
.card .num.num--text{font-family:var(--font-zh);font-weight:900;font-size:58px}
.card .sub{font-family:var(--font-num);font-weight:600;font-size:26px;color:var(--ink-dim);letter-spacing:.04em}

.card.zone--a{--accent:var(--a-a)}
.card.zone--b{--accent:var(--a-b)}
.card.zone--c{--accent:var(--a-c)}
.card.zone--d{--accent:var(--a-d)}
/* 四張卡動畫錯開 */
.card.zone--b .card__sweep::before{animation-delay:-1.1s}
.card.zone--c .card__sweep::before{animation-delay:-2.3s}
.card.zone--d .card__sweep::before{animation-delay:-3.4s}
.card.zone--b .card__in::after{animation-delay:-.9s}
.card.zone--c .card__in::after{animation-delay:-1.8s}
.card.zone--d .card__in::after{animation-delay:-2.7s}

/* 頁尾 */
.foot{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;
  border:1px solid var(--panel-line);border-radius:6px;background:var(--panel);
  backdrop-filter:blur(8px);text-align:center}
.foot .main{font-weight:700;letter-spacing:.06em}
.foot .note{color:var(--ink-dim);font-weight:500}

/* ================= 寬版（平板 / 電腦） ================= */
.stage--wide{padding:56px 64px 48px;display:flex;flex-direction:column}
.stage--wide .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.stage--wide .infobar{height:64px;font-size:24px}
.stage--wide .grid{grid-template-columns:1fr 1fr;grid-auto-rows:280px;flex:0 0 auto;margin-block:auto}
.stage--wide .foot{height:70px;font-size:22px}
.stage--wide .foot .note{font-size:19px}

/* ================= 手機版 ================= */
.stage--phone{padding:28px 18px 20px;display:flex;flex-direction:column}
.stage--phone .brand{justify-content:center;gap:14px;margin-bottom:14px}
.stage--phone .brand .bd2{height:30px}
.stage--phone .brand .sep{height:24px}
.stage--phone .brand .pandora{height:26px}
.stage--phone .infobar{height:52px;font-size:15px;margin-bottom:14px}
.stage--phone .infobar .seg{flex:1;justify-content:center;padding:0 10px}
.stage--phone .grid{grid-template-columns:1fr;gap:12px;flex:0 0 auto;margin-block:auto}
.stage--phone .card{--cut:15px;--cut-sm:9px}
.stage--phone .card__in{padding:14px 16px;gap:14px}
.stage--phone .badge{width:54px;height:54px;font-size:32px;
  clip-path:polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px), 0 8px)}
.stage--phone .card .name{font-size:22px}
.stage--phone .card .label{font-size:12px;margin-top:2px}
.stage--phone .card .value{margin-left:12px}
.stage--phone .card .num{font-size:38px}
.stage--phone .card .num.num--text{font-size:25px}
.stage--phone .card .sub{font-size:13px}
.stage--phone .foot{margin-top:14px;padding:12px 14px;flex-direction:column;gap:4px}
.stage--phone .foot .main{font-size:14px}
.stage--phone .foot .note{font-size:11px}

/* 手機版：backdrop-filter 在 iOS 較吃資源，關掉（動畫本身已是合成層安全的） */
.stage--phone .card__in{backdrop-filter:none}
.stage--phone .badge{filter:drop-shadow(0 0 10px var(--accent))}

/* ================= 動畫（只用 transform / opacity，走合成層，PC 與手機一致且不卡） ================= */
@keyframes spin{to{rotate:360deg}}
@keyframes glowPulse{0%,100%{opacity:.34}50%{opacity:.6}}

@media (prefers-reduced-motion:reduce){
  .card__sweep::before,.card__in::after{animation:none}
}
</style>
</head>
<body>

<div class="backdrop">
  <div class="sky"></div>
  <div class="city"></div>
  <div class="veil"></div>
</div>

<!-- ===================== 寬版 ===================== -->
<main class="stage stage--wide">
  <div class="top">
    <div class="brand">
      <img class="bd2" src="image/browndust2-white-tc.png" alt="BROWN DUST II">
      <span class="sep"></span>
      <img class="pandora" src="image/pandora-city.webp" alt="PANDORA CITY">
    </div>
    <div class="infobar">
      <div class="seg"><span class="val" data-bind="event"></span></div>
      <div class="seg"><span class="lbl">最後更新時間</span><span class="val" data-bind="updated"></span></div>
    </div>
  </div>

  <div class="grid" data-bind="grid"></div>

  <div class="foot">
    <span class="main">請於叫號前返回指定區域等候</span>
    <span class="note">目前號碼以前皆可入場,實際叫號狀況以現場工作人員公告為準</span>
  </div>
</main>

<!-- ===================== 手機版 ===================== -->
<main class="stage stage--phone">
  <div class="brand">
    <img class="bd2" src="image/browndust2-white-tc.png" alt="BROWN DUST II">
    <span class="sep"></span>
    <img class="pandora" src="image/pandora-city.webp" alt="PANDORA CITY">
  </div>
  <div class="infobar">
    <div class="seg"><span class="val" data-bind="event"></span></div>
    <div class="seg"><span class="lbl">更新</span><span class="val" data-bind="updated"></span></div>
  </div>

  <div class="grid" data-bind="grid"></div>

  <div class="foot">
    <span class="main">請於叫號前返回指定區域等候</span>
    <span class="note">實際叫號狀況以現場工作人員公告為準</span>
  </div>
</main>

<script>
/* ============================================================
   資料來源 —— 之後接後端只要改 fetchState()
   ============================================================ */
const STATE = {
  event: '2027 台北電玩展',
  zones: [
    { id:'A', cls:'zone--a', name:'報到區',   label:'目前叫號', value:'A-001' },
    { id:'B', cls:'zone--b', name:'商售區',   label:'目前叫號', value:'B-002' },
    { id:'C', cls:'zone--c', name:'預約取貨', label:'目前叫號', value:'C-012' },
    { id:'D', cls:'zone--d', name:'尊榮酒吧', label:'目前梯次', value:'第1梯次', sub:'10:00–10:25' },
  ]
};

// TODO: 接真實叫號來源（輪詢或 WebSocket）
// async function fetchState(){ const r = await fetch('/api/queue'); return r.json(); }

/* ---------- 版型判定（非 RWD，載入時決定一次） ---------- */
function pickLayout(){
  const forced = new URLSearchParams(location.search).get('layout');
  if (forced === 'phone' || forced === 'wide') return forced;
  const shortest = Math.min(screen.width, screen.height);
  return shortest <= 500 ? 'phone' : 'wide';
}
document.documentElement.dataset.layout = pickLayout();

/* ---------- 舞台 + 背景縮放適配 ---------- */
function fit(){
  const layout = document.documentElement.dataset.layout;
  const stage = document.querySelector('.stage--' + layout);
  if (!stage) return;

  // 背景 effect-ratio：城市寬度一律 ≥ 視窗寬（避免兩側露黑，手機在電腦上預覽也適用）
  const ratio = layout === 'phone' ? Math.min(1.7, 2560 / innerWidth) : Math.min(1, 2560 / innerWidth);
  document.documentElement.style.setProperty('--effect-ratio', String(ratio));

  if (layout === 'wide'){
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.setProperty('--scale', s);
  } else {
    // 實機手機 innerWidth≈390 → 縮放填滿寬度；
    // 電腦上用 ?layout=phone 預覽（innerWidth>500）→ 固定 390 寬置中、不放大。
    const s = innerWidth <= 500 ? innerWidth / 390 : 1;
    stage.style.setProperty('--scale', s);
    stage.style.minHeight = Math.ceil(innerHeight / s) + 'px';
    document.body.style.height = Math.max(innerHeight, stage.offsetHeight * s) + 'px';
  }
}

/* ---------- 渲染 ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function nowHM(){ const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

function cardHTML(z){
  const isText = /[^\x00-\x7F]/.test(z.value);   // 含中文等非 ASCII -> 用文字級距
  return `<article class="card ${z.cls}">
    <div class="card__sweep"></div>
    <div class="card__in">
      <div class="badge">${z.id}</div>
      <div class="info">
        <div class="name">${z.name}</div>
        <div class="label">${z.label}</div>
      </div>
      <div class="value">
        <div class="num${isText ? ' num--text' : ''}">${z.value}</div>
        ${z.sub ? `<div class="sub">${z.sub}</div>` : ``}
      </div>
    </div>
  </article>`;
}

function render(state){
  document.querySelectorAll('[data-bind="event"]').forEach(el => el.textContent = state.event);
  document.querySelectorAll('[data-bind="updated"]').forEach(el => el.textContent = nowHM());
  document.querySelectorAll('[data-bind="grid"]').forEach(el => {
    el.innerHTML = state.zones.map(cardHTML).join('');
  });
  fit();
}

render(STATE);

// 只有「寬度」變才重排。iOS Safari 捲動收合網址列會狂發 resize（只改高度），
// 若每次都重排 + 改 body 高度會形成迴圈，Safari 就會「重複發生問題」而重載。
let lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  fit();
});
addEventListener('orientationchange', () => setTimeout(() => { lastW = innerWidth; fit(); }, 250));

// 更新時間戳（暫以本機時間；接後端後改為資料回傳值）
setInterval(() => {
  document.querySelectorAll('[data-bind="updated"]').forEach(el => el.textContent = nowHM());
}, 15000);
</script>
</body>
</html>
